# Server
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apextrade}
spring.datasource.username=${DB_USER:apextrade_user}
spring.datasource.password=${DB_PASS:apextrade_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Python Service
python.service.url=${PYTHON_SERVICE_URL:http://localhost:8000}

# JWT
jwt.secret=${JWT_SECRET:apextrade-secret-key-for-development-only}
jwt.expiration=86400000